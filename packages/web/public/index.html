<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="author" content="Praveen Antony">
  <meta name="description" content="Play the classic 56 card game online with friends or bots!">

  <!-- PWA theme -->
  <meta name="theme-color" content="#1a472a">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="56 Card Game">
  <!-- PLACEHOLDER: replace with your apple-touch-icon once generated -->
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/apple-touch-icon.png">

  <!-- PWA splash screen icons for iOS (generated via generate-icons.js) -->
  <link rel="apple-touch-startup-image" sizes="152x152" href="%PUBLIC_URL%/icons/icon-152x152.png">
  <link rel="apple-touch-startup-image" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192x192.png">

  <!-- Android / Windows PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="msapplication-TileColor" content="#1a472a">
  <!-- PLACEHOLDER: replace with your title icon once generated -->
  <meta name="msapplication-TileImage" content="%PUBLIC_URL%/icons/icon-144x144.png">

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
  <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">

  <link href="/css/card.css" rel="stylesheet" type="text/css" />
  <script src="/js/card.js" defer></script>
  <title>56</title>
</head>

<body
  style="background: url(./images/background.jpg); margin: 0; padding: 0; min-height: 100vh; background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;">
  <style>
    html,
    body,
    #root {
      min-height: 100vh;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    #root {
      display: flex;
      flex-direction: column;
    }
  </style>

  <!-- Loading Screen -->
  <!-- This will be displayed while the app is loading, especially useful for slow server wake-up times -->
  <div id="loading-screen"
    style="position:fixed; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#ffffff; z-index:9999;">
    <!-- Your Logo or Spinner here -->
    <div class="spinner"></div>

    <!-- Dynamic Loading Text -->
    <p id="loading-msg" style="margin-top: 20px; font-family: sans-serif; color: #555;">
      Waking up the server...
    </p>
  </div>

  <script>
    const messages = [
      "Waking up the server...",
      "AI bots are getting ready...",
      "Loading game intelligence...",
      "Calibrating bidding strategies...",
      "Optimizing decision engine...",
      "Warming up the strategy engine...",
      "Finalizing the game table...",
      "Almost there, just a moment..."
    ];
    let i = 0;
    const msgElement = document.getElementById('loading-msg');

    // Rotate text every 4 seconds
    const interval = setInterval(() => {
      i = (i + 1) % messages.length;
      msgElement.innerText = messages[i];
    }, 4000);

    // Function to hide the loader once your main app is ready
    window.addEventListener('load', () => {
      clearInterval(interval);
      document.getElementById('loading-screen').style.display = 'none';
    });
  </script>
  <!-- End of Loading Screen -->

  <noscript>
    You need to enable JavaScript to run this app.
  </noscript>
  <div id="root">
  </div>
</body>

</html>

# Builds the packages and runs the game-server tests.
# The test step is blocking: a failing game-server test fails the workflow.

name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build common package
        run: npm run build
        working-directory: packages/common

      - name: Build server
        run: npm run build
        working-directory: packages/game-server

      - name: Build web client
        run: npm run build
        working-directory: packages/web

      - name: Run game-server tests
        run: npm run test:ci
        working-directory: packages/game-server

      - name: Copy web build to server client folder
        run: |
          rm -rf packages/game-server/client/*
          cp -r packages/web/build/* packages/game-server/client/
